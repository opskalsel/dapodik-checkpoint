<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Admin - Dapodik Checkpoint</title>

  <link rel="icon" type="image/png" href="assets/logo-dapodik.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="admin.html">
        <img
          src="assets/logo-dapodik.png"
          alt="Logo Dapodik"
          class="brand-logo"
          onerror="this.style.display='none'"
        />
        <span class="brand-text">
          <strong>Dapodik</strong> Checkpoint
        </span>
      </a>

      <div class="header-actions">
        <a class="btn btn-outline" href="admin.html">Dashboard Admin</a>
        <a class="btn btn-outline" href="admin-profil.html">Profil Admin</a>
        <div class="dropdown-container">
          <button id="admin-profil-dropdown-toggle" class="btn btn-primary" type="button">
            Ubah Profil ▼
          </button>

          <div id="admin-profil-dropdown-menu" class="dropdown-menu" style="display: none;">
            <button class="dropdown-item" data-section="admin-data">
              📝 Ubah Data Admin
            </button>
            <button class="dropdown-item" data-section="admin-password">
              🔒 Ubah Password
            </button>
          </div>
        </div>
        <button id="logout-button" class="btn btn-outline" type="button">
          Keluar
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container" id="admin-profil-page">
      <div id="admin-profil-message" class="alert" role="alert"></div>

      <section class="card">
        <h2 class="dashboard-title">Profil Admin</h2>

        <div class="profile-list">
          <div class="profile-item">
            <span>Role</span>
            <strong id="admin-profil-role-badge" class="badge badge-red">Admin</strong>
          </div>

          <div class="profile-item">
            <span>Nama</span>
            <strong id="admin-profil-nama">-</strong>
          </div>

          <div class="profile-item">
            <span>Username</span>
            <strong id="admin-profil-username">-</strong>
          </div>

          <div class="profile-item">
            <span>Email</span>
            <strong id="admin-profil-email">-</strong>
          </div>

          <div class="profile-item">
            <span>No. HP / WA</span>
            <strong id="admin-profil-no-hp">-</strong>
          </div>
        </div>
      </section>

      <!-- Section 1: Ubah Data Admin -->
      <section class="card" id="section-admin-data" style="display: none; margin-top: 16px;">
        <div class="section-header-with-close">
          <h2 class="dashboard-title">Ubah Data Admin</h2>
          <button class="btn-close-section" data-section="admin-data" type="button">×</button>
        </div>

        <div id="admin-data-message" class="alert" role="alert"></div>

        <form id="admin-data-form" novalidate>
          <div class="form-grid-2">
            <div class="field">
              <label for="admin-nama-operator">Nama</label>
              <input
                type="text"
                id="admin-nama-operator"
                placeholder="Contoh: Administrator"
              />
            </div>

            <div class="field">
              <label for="admin-email">Email</label>
              <input
                type="email"
                id="admin-email"
                autocomplete="email"
                placeholder="Contoh: admin@sekolah.sch.id"
              />
            </div>

            <div class="field">
              <label for="admin-no-hp">No. HP / WA</label>
              <input
                type="text"
                id="admin-no-hp"
                inputmode="tel"
                placeholder="Contoh: 081234567890"
              />
            </div>
          </div>

          <div class="form-actions">
            <button
              type="submit"
              id="admin-data-submit"
              class="btn btn-primary btn-block"
            >
              Simpan Data Admin
            </button>
          </div>
        </form>
      </section>

      <!-- Section 2: Ubah Password -->
      <section class="card" id="section-admin-password" style="display: none; margin-top: 16px;">
        <div class="section-header-with-close">
          <h2 class="dashboard-title">Ubah Password</h2>
          <button class="btn-close-section" data-section="admin-password" type="button">×</button>
        </div>

        <div id="admin-password-message" class="alert" role="alert"></div>

        <form id="admin-password-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="admin-current-password">Password Lama</label>
              <input
                type="password"
                id="admin-current-password"
                autocomplete="current-password"
                placeholder="Masukkan password lama"
              />
            </div>

            <div class="field">
              <label for="admin-new-password">Password Baru</label>
              <input
                type="password"
                id="admin-new-password"
                autocomplete="new-password"
                placeholder="Minimal 8 karakter"
              />
            </div>

            <div class="field">
              <label for="admin-confirm-password">Konfirmasi Password Baru</label>
              <input
                type="password"
                id="admin-confirm-password"
                autocomplete="new-password"
                placeholder="Ulangi password baru"
              />
            </div>
          </div>

          <div class="form-actions">
            <button
              type="submit"
              id="admin-password-submit"
              class="btn btn-primary btn-block"
            >
              Simpan Password
            </button>
          </div>
        </form>
      </section>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-profil.js"></script>
  <script src="js/notifikasi.js"></script>
</body>
</html>
