<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - Dapodik Checkpoint</title>
  <meta name="description" content="Masuk ke aplikasi Dapodik Checkpoint." />

  <link rel="icon" type="image/png" href="assets/logo-dapodik.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img
          src="assets/logo-dapodik.png"
          alt="Logo Dapodik"
          class="brand-logo"
          onerror="this.style.display='none'"
        />
        <span class="brand-text">
          <strong>Dapodik</strong> Checkpoint
        </span>
      </a>
    </div>
  </header>

  <main class="auth-page">
    <div class="container">
      <div class="auth-card">
        <div class="auth-brand">
          <img
            src="assets/logo-dapodik.png"
            alt="Logo Dapodik"
            onerror="this.style.display='none'"
          />
        </div>

        <div class="auth-head">
          <span id="login-role-badge" class="badge badge-blue">Operator</span>
          <h1 id="login-title" class="auth-title">Masuk sebagai Operator</h1>
          <p id="login-subtitle" class="auth-sub">
            Gunakan akun operator sekolah Anda untuk melanjutkan checklist.
          </p>
        </div>

        <div id="login-message" class="alert" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="login-username">Username</label>
              <input
                type="text"
                id="login-username"
                name="username"
                autocomplete="username"
                placeholder="Contoh: operator_sekolah"
              />
            </div>

            <div class="field">
              <label for="login-password">Password</label>
              <input
                type="password"
                id="login-password"
                name="password"
                autocomplete="current-password"
                placeholder="Masukkan password"
              />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="login-submit" class="btn btn-primary btn-block">
              Masuk
            </button>
          </div>
        </form>

        <div class="auth-footer">
          Belum punya akun?
          <a class="muted-link" href="register.html">Daftar Akun</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifikasi.js"></script>
</body>
</html>
