<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Checklist - Dapodik Checkpoint</title>

  <link rel="icon" type="image/png" href="assets/logo-dapodik.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="dashboard.html">
        <img
          src="assets/logo-dapodik.png"
          alt="Logo Dapodik"
          class="brand-logo"
          onerror="this.style.display='none'"
        />
        <span class="brand-text">
          <strong>Dapodik</strong> Checkpoint
        </span>
      </a>

      <div class="header-actions">
        <a class="btn btn-outline" href="dashboard.html">Dashboard</a>
        <a class="btn btn-outline" href="checklist.html">Checklist</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container" id="riwayat-page">
      <div id="riwayat-message" class="alert" role="alert"></div>

      <section class="card riwayat-toolbar">
        <div class="section-heading">
          <h2>Riwayat Checklist</h2>
          <p>
            Daftar snapshot progres checklist berdasarkan semester dan tahun pelajaran.
          </p>
        </div>

        <button id="reload-riwayat-button" class="btn btn-outline" type="button">
          Muat Ulang
        </button>
      </section>

      <section class="card" id="compare-card" style="margin-bottom: 16px;">
  <div class="section-heading">
    <h2>Bandingkan Periode</h2>
    <p>
      Pilih dua periode untuk melihat selisih progres per tahap.
      Selisih dihitung sebagai Periode B dikurangi Periode A.
    </p>
  </div>

  <div class="compare-controls">
    <div class="field">
      <label for="compare-period-a">Periode A</label>
      <select id="compare-period-a" class="select-input"></select>
    </div>

    <div class="field">
      <label for="compare-period-b">Periode B</label>
      <select id="compare-period-b" class="select-input"></select>
    </div>

    <div class="field">
      <label>&nbsp;</label>
      <button id="compare-button" class="btn btn-primary btn-block" type="button">
        Bandingkan
      </button>
    </div>
  </div>

  <div id="compare-message" class="alert" role="alert"></div>

  <div id="compare-result" class="compare-result"></div>
  <div
  id="compare-export-actions"
  class="compare-export-actions"
  style="display: none;"
>
  <button
    id="compare-export-excel-button"
    class="btn btn-outline"
    type="button"
  >
    Export Excel Perbandingan
  </button>

  <button
    id="compare-export-pdf-button"
    class="btn btn-primary"
    type="button"
  >
    Export PDF Perbandingan
  </button>
</div>
</section>

      <div id="riwayat-list" class="riwayat-list"></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <!-- Library ekspor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <script src="js/riwayat.js"></script>
  <script src="js/notifikasi.js"></script>
</body>
</html>
